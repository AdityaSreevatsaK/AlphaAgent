repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Must be kept in sync with pyproject.toml and CI
    rev: v0.12.4
    hooks:
      - id: ruff
        # Limit to only Python files, excluding notebooks
        types_or: [python, pyi]
        args: [ --fix ] # Automatically fix what it can
      - id: ruff-format
        # Limit to only Python files, excluding notebooks
        types_or: [python, pyi]
